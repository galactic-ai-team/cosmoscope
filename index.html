<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cosmoscope: a map of the whole universe</title>
<style>
 html,body{margin:0;height:100%;background:#000;color:#dfe8ff;font-family:system-ui,sans-serif;overflow:hidden}
 #app{position:fixed;inset:0}
 #search{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(420px,90vw);z-index:5}
 #search input{width:100%;box-sizing:border-box;padding:10px 14px;border-radius:22px;border:1px solid #3a4a7a;background:#0b1024cc;color:#fff;font-size:15px;outline:none}
 #search ul{list-style:none;margin:4px 0 0;padding:0;background:#0b1024ee;border-radius:12px;max-height:50vh;overflow:auto}
 #search li{padding:8px 14px;cursor:pointer}#search li[aria-selected=true],#search li:hover{background:#22305e}#search li.no-results{cursor:default;opacity:.65;font-style:italic;background:none}
 #info{position:fixed;right:16px;bottom:16px;width:min(320px,85vw);background:#0b1024e6;border:1px solid #3a4a7a;border-radius:14px;padding:14px 16px;z-index:5}
 #info[hidden]{display:none}#info h2{margin:0 0 6px;font-size:18px}#info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
 #info dt{opacity:.7}#info button{position:absolute;top:8px;right:10px;background:none;border:0;color:#aab;font-size:18px;cursor:pointer}
 #zone{position:fixed;left:16px;top:16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;z-index:5}
 #tour{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:5;padding:8px 14px;border-radius:999px;border:1px solid #fff4;background:#0008;color:inherit;font:inherit;font-size:13px;cursor:pointer}
 #tour[aria-pressed="true"]{background:#fff2}
 #scale{position:fixed;left:16px;bottom:16px;font-size:13px;opacity:.8;z-index:5}
/* GPT-6: mobile HUD spacing — 390x844 and smaller phones */
@media (max-width: 480px) {
  /* Row 1: current location / universe scale */
  #zone {
    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    max-width: calc(100vw - 24px);
    font-size: 11px;
    line-height: 18px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Row 2: Constellations and Help */
  #constellations-btn {
    top: calc(max(12px, env(safe-area-inset-top)) + 30px) !important;
    right: 58px !important;
  }

  #help-btn {
    top: calc(max(12px, env(safe-area-inset-top)) + 30px) !important;
    right: 16px !important;
  }

  /* Row 3: Search */
  #search {
    top: calc(max(12px, env(safe-area-inset-top)) + 78px);
    width: calc(100vw - 24px);
    max-width: 420px;
  }

  #search ul {
    max-height: min(40vh, 280px);
  }

  /* Keep Earth handoff below search */
  #walk-earth {
    top: calc(max(12px, env(safe-area-inset-top)) + 132px) !important;
    bottom: auto !important;
  }

  /* Move distance above Grand Tour and free-fly controls */
  #scale {
    left: 12px;
    right: 12px;
    bottom: calc(188px + env(safe-area-inset-bottom));
    max-width: calc(100vw - 24px);
    font-size: 12px;
    line-height: 17px;
    pointer-events: none;
  }

  #tour {
    bottom: calc(16px + env(safe-area-inset-bottom));
  }

  #free-fly {
    bottom: calc(16px + env(safe-area-inset-bottom));
  }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="search" data-label-exclude><input type="search" placeholder="Search planets, stars, galaxies…" aria-label="Search the universe" autocomplete="off" /><ul role="listbox" hidden></ul></div>
<aside id="info" data-label-exclude hidden aria-live="polite"><button aria-label="Close">×</button><h2></h2><p></p><dl></dl></aside>
<div id="zone" data-label-exclude aria-live="polite"></div>
<div id="scale" data-label-exclude></div>
<button id="tour" data-label-exclude type="button" aria-pressed="false">Grand Tour</button>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
